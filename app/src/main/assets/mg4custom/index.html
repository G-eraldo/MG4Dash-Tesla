<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>MG4Dash — accueil personnalisé</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand"><span class="mg-mark">MG</span><strong>MG4</strong></div>
      <div class="clock"><strong id="clock">--:--</strong><span id="date">—</span></div>
      <div class="status"><span id="outside">Temp. ext. —</span><span class="connection" id="connection">Données en attente</span><button class="profile" data-page="settings" aria-label="Réglages">♙</button></div>
    </header>
    <div class="workspace">
      <nav class="rail" aria-label="Pages MG4Dash">
        <button class="rail-button selected" aria-label="Accueil" title="Accueil">⌂</button>
        <button class="rail-button" data-page="navigation" aria-label="Navigation" title="Navigation">➤</button>
        <button class="rail-button" data-page="media" aria-label="Médias" title="Médias">♫</button>
        <button class="rail-button" data-page="phone" aria-label="Téléphone" title="Téléphone">☎</button>
        <button class="rail-button" data-page="apps" aria-label="Applications" title="Applications">▦</button>
        <button class="rail-button" data-page="vehicle" aria-label="Véhicule" title="Véhicule">⌂</button>
      </nav>
      <section class="parked-view" aria-label="Accueil à l’arrêt">
        <div class="parked-car panel">
          <div class="park-speed"><strong id="parkSpeed">—</strong><span class="speed-unit">km/h</span><small>À l’arrêt</small></div>
          <div class="park-scene-label">Illustration MG4</div>
        </div>
        <div class="battery-card panel clickable" data-page="energy" role="button" tabindex="0" aria-label="Ouvrir la page Énergie">
          <div class="battery-head"><span class="battery-icon">▣</span><strong id="parkBattery">—</strong><span>%</span></div>
          <div class="battery-track"><span id="batteryFill"></span></div>
          <div class="battery-footer"><div><span class="metric-icon">▰</span><div><strong id="parkRange">—</strong><small>Autonomie estimée</small></div></div><div><span class="metric-icon">ϟ</span><div><strong id="parkAvg">—</strong><small>Conso. moyenne</small></div></div></div>
        </div>
        <section class="consumption-card panel">
          <div class="card-head"><h2>◌&nbsp; Consommation</h2><div class="segments"><button data-period="1">Trajet</button><button data-period="0">Recharge</button><button data-period="2">12 mois</button></div></div>
          <button class="chart-button" data-page="energy" aria-label="Ouvrir la page Énergie"><svg class="chart" viewBox="0 0 340 120" preserveAspectRatio="none" aria-hidden="true"><path class="gridline" d="M0 20H340 M0 60H340 M0 100H340"/><polyline id="chartLine" points=""/></svg><span id="chartEmpty">Courbe en attente</span></button>
          <div class="chart-bottom"><span id="chartPeriod">Depuis le trajet</span><strong id="chartAverage">—</strong></div>
        </section>
        <section class="climate-card panel">
          <div class="card-head"><button class="card-title-button" data-page="climate">✥&nbsp; Climatisation</button><button class="power-button" data-climate="power" aria-label="Allumer ou éteindre la climatisation">⏻</button></div>
          <div class="temperature"><button data-climate="tempDown" aria-label="Baisser la température">−</button><strong id="parkTemp">—</strong><button data-climate="tempUp" aria-label="Augmenter la température">+</button></div>
          <div class="climate-actions"><button data-climate="auto">AUTO</button><button data-climate="recirc" aria-label="Recyclage d’air">♧</button><button data-climate="ac">A/C</button><button data-climate="front" aria-label="Dégivrage avant">▧</button><button data-climate="rear" aria-label="Dégivrage arrière">▤</button></div>
        </section>
        <button class="map-card panel" data-page="navigation" aria-label="Ouvrir la navigation"><span class="card-head"><strong>➤&nbsp; Navigation</strong><span class="map-search">⌕&nbsp; Où aller ?</span></span><span class="map-art"><span class="map-route"></span><span class="map-pointer">▲</span></span><small>Ouvrir la navigation</small></button>
        <section class="shortcuts-card panel"><div class="card-head"><h2>⌂&nbsp; Raccourcis MG4Dash</h2><div class="shortcut-tools"><button data-next-shortcuts aria-label="Autres raccourcis">›</button><button data-edit-shortcuts class="edit-button">Modifier</button></div></div><div class="shortcut-grid" id="parkShortcuts"></div></section>
        <section class="media-card panel"><div class="media-info"><span class="album">♫</span><button data-page="media" class="media-details"><strong id="parkMediaTitle">Média</strong><small id="parkMediaArtist">Aucune source</small></button></div><div class="media-controls"><button data-media="previous" aria-label="Précédent">◀◀</button><button data-media="playPause" aria-label="Lecture ou pause" class="play" id="parkPlay">▶</button><button data-media="next" aria-label="Suivant">▶▶</button></div><div class="media-progress"></div></section>
      </section>
      <section class="driving-view" aria-label="Accueil en marche" hidden>
        <div class="drive-stage panel">
          <div class="drive-metrics"><div class="drive-gauge"><span class="gauge-arc"></span><strong id="driveBattery">—</strong><small>Autonomie estimée</small><b id="driveRange">—</b></div><div class="drive-data"><small>Conso. moyenne</small><strong id="driveAvg">—</strong></div><div class="drive-data"><small>Puissance instantanée</small><strong id="drivePower">—</strong></div></div>
          <div class="drive-speed"><strong id="driveSpeed">—</strong><span class="speed-unit">km/h</span></div>
          <button class="drive-navigation" data-page="navigation"><span id="navAction">➤&nbsp; Navigation</span><strong id="navDistance">Ouvrir l’itinéraire</strong><small id="navRoad">Guidage dans votre application de navigation</small><span class="mini-map"><i></i><b>▲</b></span></button>
          <div class="drive-bottom"><span id="driveSource">Données en attente</span><strong>En route</strong></div>
        </div>
        <aside class="drive-side">
          <section class="media-card panel"><div class="media-info"><span class="album">♫</span><button data-page="media" class="media-details"><strong id="driveMediaTitle">Média</strong><small id="driveMediaArtist">Aucune source</small></button></div><div class="media-controls"><button data-media="previous" aria-label="Précédent">◀◀</button><button data-media="playPause" aria-label="Lecture ou pause" class="play" id="drivePlay">▶</button><button data-media="next" aria-label="Suivant">▶▶</button></div><div class="media-progress"></div></section>
          <section class="drive-climate panel"><button data-page="climate" class="drive-temp"><strong id="driveTemp">—</strong><small>Climatisation</small></button><button data-climate="ac" aria-label="A/C">❄</button><button data-climate="fanUp" aria-label="Augmenter la ventilation">✥</button><button data-page="climate" aria-label="Ouvrir la climatisation">↗</button></section>
          <section class="shortcuts-card panel"><div class="card-head"><h2>⌂&nbsp; Raccourcis MG4Dash</h2><div class="shortcut-tools"><button data-next-shortcuts aria-label="Autres raccourcis">›</button><button data-edit-shortcuts class="edit-button">Modifier</button></div></div><div class="shortcut-grid" id="driveShortcuts"></div></section>
        </aside>
      </section>
    </div>
  </main>
  <script src="state.js"></script><script src="app.js"></script>
</body>
</html>
